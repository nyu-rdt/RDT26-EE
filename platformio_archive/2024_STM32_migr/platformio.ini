; PlatformIO Project Configuration File
; STM32F446RE Bare-Metal Migration from Teensy 4.1 Arduino
; Rover Control System - Time-Triggered Deterministic Control
; No RTOS - Industry-grade bare-metal architecture

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200

; No external libraries - pure HAL drivers
lib_deps =

build_flags =cu
  -I include
  -D USE_HAL_DRIVER
  -D STM32F446xx
  ; Enable HAL modules we need
  -D HAL_CAN_MODULE_ENABLED
  -D HAL_TIM_MODULE_ENABLED
  -D HAL_I2C_MODULE_ENABLED
  -D HAL_ADC_MODULE_ENABLED
  -D HAL_UART_MODULE_ENABLED

debug_tool = stlink
debug_init_break = tbreak main

