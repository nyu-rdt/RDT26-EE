; PlatformIO Project Configuration File
; STM32F446RE + FreeRTOS (local lib copy, ARM_CM3 port)
; Rover Control System - Real-Time Deterministic Control

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200

; FreeRTOS is in lib/FreeRTOS (copied from STM32CubeF4 middleware)
lib_deps =

; Use our custom HAL config
board_build.stm32cube.custom_config_header = yes

build_flags =
  -I include
  -D USE_HAL_DRIVER
  -D STM32F446xx

debug_tool = stlink
debug_init_break = tbreak main
