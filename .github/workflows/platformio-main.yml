name: PlatformIO Main Project Compile

on:
  push:
    branches: [main, master]
    paths:
      - "platformio_projects/RDT_2025_26_TEENSY4_1/**"
      - ".github/workflows/platformio-main.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "platformio_projects/RDT_2025_26_TEENSY4_1/**"
      - ".github/workflows/platformio-main.yml"
  workflow_dispatch:

jobs:
  compile-main-project:
    name: Main Project Compiles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platformio_projects/RDT_2025_26_TEENSY4_1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile Main Project
        run: pio run

      - name: Add summary
        if: always()
        run: |
          echo "## Main Project" >> "$GITHUB_STEP_SUMMARY"
          echo '- Path: `platformio_projects/RDT_2025_26_TEENSY4_1`' >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
