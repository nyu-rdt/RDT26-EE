; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Sensor bring-up monitor — streams current sensors + encoders to Teleplot.
; Pulls test_main.cpp in as the entry point via the relative path filter;
; only the two needed sensor drivers are compiled from src/.
; Build + upload:  pio run -e teensy41_sensor_test -t upload
; Monitor:         Serial Monitor / Teleplot @ 115200 baud
[env:teensy41_sensor_test]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = +<../test/test_sensors/*> +<current_sensors.cpp> +<rotary_encoders.cpp>
