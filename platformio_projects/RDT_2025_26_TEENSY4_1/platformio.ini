; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Sensor bring-up test — streams current sensors + encoders to Teleplot.
; Compile only the sensor drivers from src/; the test file in
; test/test_sensors/ provides its own setup()/loop() via Unity.
; Run with:  pio test -e teensy41_sensor_test
[env:teensy41_sensor_test]
platform = teensy
board = teensy41
framework = arduino
build_src_filter = +<*> -<main.cpp> -<child.cpp> -<can_driver.cpp> -<depo_door_driver.cpp> -<vib_motor_driver.cpp> -<system.cpp> -<stepper_driver.cpp>
test_speed = 115200
; 90 s: 2 s startup delay + 60 s stream + margin for Unity output
test_timeout = 90
